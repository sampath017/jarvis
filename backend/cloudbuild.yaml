steps:
  # 1. Build the container image using Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/jarvis-api:$_TAG'
      - '.'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/jarvis-api:$_TAG'

  # 3. Deploy container image to Cloud Run with configuration limits and Secret Manager references
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'jarvis-api'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/jarvis-api:$_TAG'
      - '--region=$_RUN_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=jarvis-backend@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout=60'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=FIREBASE_PROJECT_ID=$PROJECT_ID,APP_CHECK_MODE=monitor,LOG_LEVEL=INFO,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=Jarvis,LANGSMITH_TRACING=true,LANGSMITH_PROJECT=Jarvis'
      - '--set-secrets=OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,GOOGLE_PLACES_API_KEY=GOOGLE_PLACES_API_KEY:latest,LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'

images:
  - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/jarvis-api:$_TAG'

substitutions:
  _AR_REGION: asia-south1
  _AR_REPOSITORY: jarvis-repo
  _RUN_REGION: asia-south1
  _TAG: latest
