[project]
name = "jarvis-api"
version = "0.1.0"
description = "Jarvis Context-Aware Mobile Agent — Cloud Run API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # LangGraph / LangChain
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    # HTTP client
    "httpx>=0.28.0",
    # Data validation & settings
    "pydantic>=2.13.4",
    "pydantic-settings>=2.8.0",
    # Structured logging
    "structlog>=25.1.0",
    # LLM observability
    "langsmith>=0.3.0",
    # Environment
    "python-dotenv>=1.2.2",
    "langchain>=1.3.14",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "scipy>=1.18.1",
    "ipykernel>=7.3.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.19.0",
    "beautifulsoup4>=4.15.0",
    "chromadb==1.5.9",
    "pymupdf==1.28.2",
    "pillow==12.3.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "xlrd>=2.0.2",
    "libarchive-c>=5.3",
    "pyaxmlparser>=0.3.31",
    "pefile>=2024.8.26",
]

[project.scripts]
backend = "src.api.main:run"
jarvis-api = "src.api.main:run"
purge-chats = "scripts.purge_chats:purge"
delete-chats = "scripts.delete_all_chats:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
