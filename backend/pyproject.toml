[project]
name = "jarvis-api"
version = "0.1.0"
description = "Jarvis Context-Aware Mobile Agent — Cloud Run API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Firebase
    "firebase-admin>=6.6.0",
    # LangGraph / LangChain
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    # HTTP client
    "httpx>=0.28.0",
    # Data validation & settings
    "pydantic>=2.13.4",
    "pydantic-settings>=2.8.0",
    # Structured logging
    "structlog>=25.1.0",
    # LLM observability
    "langsmith>=0.3.0",
    # Environment
    "python-dotenv>=1.2.2",
    "langchain>=1.3.14",
]

[project.scripts]
jarvis-api = "src.api.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
]
